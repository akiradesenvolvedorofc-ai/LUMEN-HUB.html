<style>

.dr{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);visibility:hidden;opacity:0;transition:.25s}.dr.open{visibility:visible;opacity:1}

.box{background:#120a0c;color:#f5f1f2;border:1px solid var(--line);border-radius:calc(var(--r) + 6px);width:min(500px,100%);max-height:92vh;overflow:auto;position:relative;animation:p .3s cubic-bezier(.2,1.2,.3,1)}@keyframes p{from{transform:scale(.92);opacity:0}}
.box .bp{padding:20px}.box .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;z-index:2}
.box h2{font-size:30px}.box .cov{aspect-ratio:2/1}
pre{background:#000;border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;max-height:200px;font:12px/1.5 ui-monospace,monospace;margin:12px 0;color:#f5f1f2}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);outline:0;margin-bottom:10px;color:inherit}.in:focus{border-color:var(--a)}select.in option{color:#111}
label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:4px}.msg{min-height:20px;color:#ff6b7a;font-weight:700;font-size:13px;margin-bottom:8px}
.adm{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:16px 14px 60px}.ah{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto 16px}.ah h2{font-size:30px;margin-right:auto}.ac{max-width:900px;margin:auto}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}.li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}input[type=color]{padding:2px;height:46px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;background:var(--g);color:#fff;padding:10px 22px;border-radius:99px;font-weight:700;animation:p .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}

.av{width:32px;height:32px;border-radius:50%;object-fit:cover}
.chatb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:58px;height:58px;border-radius:50%;background:var(--g);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 50%,transparent);transition:.2s}.chatb:hover{transform:scale(1.08)}
.chat{position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:56;width:min(380px,calc(100% - 24px));height:min(520px,70vh);display:flex;flex-direction:column;background:#120a0c;color:#f5f1f2;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;animation:p .3s}
.chh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--g);color:#fff}
.chm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.cm{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.08);font-size:14px;word-break:break-word}.cm small{display:block;font-size:11px;color:#a79da0;font-weight:700}
.cm.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--a) 35%,#120a0c)}
.chi{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}.chi input{flex:1;min-width:0;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);outline:0;color:inherit}
.rate{font-size:30px;color:#555;cursor:pointer;margin:6px 0}.rate span.on{color:#ffc233}
</style>

<body>
<header><div class="ic" data-a="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
<div class="sb"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="sq" placeholder="O que você procura?"></div>
<div class="lg" data-a="go" data-v="home"><i id="lgi"></i><span id="nm"></span></div>
<div class="ic" id="usr" data-a="user" aria-label="Conta"></div>
<div class="ic" data-a="cart" aria-label="Carrinho"><svg viewBox="0 0 24 24"><path d="M2 3h3l3 12h11l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span class="cnt" id="cc">0</span></div></header>
<main id="app"></main>
<footer id="foot"></footer>
<div class="dr" id="dr"></div><div id="layer"></div><div id="chat"></div><div class="chatb" data-a="chat" aria-label="Suporte"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></svg></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://fimitukltthqqevupkpc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JlrHt090IzYWyG_gHnJuAQ_1HkzEoep';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
</script>
<script>const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hue = s => [...String(s)].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % 360;
const brl = n => n > 0 ? 'R$ ' + (+n).toFixed(2).replace('.', ',') : 'Grátis';
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const USVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>';
async function currentAuth() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return { user: null, isAdmin: false };
  const { data: role } = await sb.from('user_roles').select('role').eq('user_id', user.id).eq('role', 'admin').maybeSingle();
  return { user, isAdmin: !!role };
}
const mapScript = (s, code, locked) => ({
  id:s.id,name:s.name,game:s.game,price:+s.price||0,hot:!!s.hot,desc:s.description||'',img:s.img||'',
  ...(code !== undefined ? {code} : {}), locked:!!locked
});
const mapExec = e => ({id:e.id,name:e.name,plat:e.plat,status:e.status,desc:e.description||'',link:e.link||'#'});
const mapReview = r => ({id:r.id,userId:r.user_id,name:r.name,avatar:r.avatar||'',rating:r.rating,text:r.text,verified:!!r.verified,at:new Date(r.created_at).getTime()});

async function bootstrap() {
  const auth = await currentAuth();
  const [{data:cfg},{data:scripts},{data:execs},{data:reviews},{count:reviewCount},{data:avgRows},{count:deliveredCount}] = await Promise.all([
    sb.from('config').select('*').eq('id',1).maybeSingle(),
    sb.from('scripts').select('id,name,game,price,hot,description,img').order('created_at',{ascending:false}),
    sb.from('execs').select('id,name,plat,status,description,link').order('created_at',{ascending:false}),
    sb.from('reviews').select('*').order('created_at',{ascending:false}),
    sb.from('reviews').select('*',{count:'exact',head:true}),
    sb.from('reviews').select('rating'),
    sb.from('orders').select('*',{count:'exact',head:true}).eq('status','paid')
  ]);
  if (scripts === null) throw new Error('Não foi possível carregar os scripts.');
  let owned = new Set();
  if (auth.user) {
    const {data:paidOrders} = await sb.from('orders').select('id,order_items(script_id)').eq('user_id',auth.user.id).eq('status','paid');
    (paidOrders||[]).forEach(o => (o.order_items||[]).forEach(i => owned.add(i.script_id)));
  }
  const scriptOut = await Promise.all((scripts||[]).map(async s => {
    const open = (+s.price||0) <= 0 || owned.has(s.id) || auth.isAdmin;
    let code;
    if (open) {
      const {data, error} = await sb.rpc('get_script_code',{p_script_id:s.id});
      if (error) throw error;
      code = data ?? '';
    }
    return mapScript(s, code, !open);
  }));
  const ratings=(avgRows||[]).map(x=>+x.rating).filter(Number.isFinite);
  const avg=ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : 0;
  const c=cfg||{id:1,name:'Lumen Hub',tag:'',logo:'',a:'#ff2d3d',b:'#ff7a45',bg:'#050305',r:20,light:false,discord:'',insta:'',footer:''};
  return {
    cfg:{...c,r:c.radius ?? c.r ?? 20,light:!!c.light},
    scripts:scriptOut,
    execs:(execs||[]).map(mapExec),
    reviews:(reviews||[]).map(mapReview),
    stats:{reviews:reviewCount||0,avg:+avg.toFixed(1),delivered:deliveredCount||0}
  };
}

const api = async (p, m = 'GET', b) => {
  const method=m.toUpperCase();
  if (p==='/bootstrap') return bootstrap();
  if (p==='/me') {
    const {user,isAdmin}=await currentAuth();
    if (!user) return {user:null};
    return {user:{id:user.id,username:user.user_metadata?.full_name||user.user_metadata?.name||user.user_metadata?.user_name||user.email||'Usuário',avatar:user.user_metadata?.avatar_url||'',isAdmin,inGuild:true,locked:false}};
  }
  if (p==='/auth/logout') { const {error}=await sb.auth.signOut(); if(error) throw error; return {ok:1}; }
  if (p==='/admin/unlock') {
    const {isAdmin}=await currentAuth();
    if(!isAdmin) throw new Error('Sua conta não é administradora.');
    return {ok:1};
  }
  if (/^\/(scripts|execs)(?:\/([^/]+))?$/.test(p)) {
    const mm=p.match(/^\/(scripts|execs)(?:\/([^/]+))?$/), k=mm[1], id=mm[2];
    const {isAdmin}=await currentAuth(); if(!isAdmin) throw new Error('Acesso negado.');
    const table=k;
    if(method==='POST'){
      const row=k==='scripts'
        ? {name:String(b.name||'').trim(),game:String(b.game||'Universal').trim(),price:Math.max(0,+b.price||0),description:String(b.desc||'').trim(),img:String(b.img||'').trim(),code:String(b.code||''),hot:!!b.hot}
        : {name:String(b.name||'').trim(),plat:String(b.plat||'').trim(),status:String(b.status||'').trim(),description:String(b.desc||'').trim(),link:String(b.link||'#').trim()};
      if(!row.name) throw new Error('Nome obrigatório.');
      const {data,error}=await sb.from(table).insert(row).select(k==='scripts'?'id,name,game,price,hot,description,img':'id,name,plat,status,description,link').single();
      if(error) throw error;
      return k==='scripts'?mapScript(data,undefined,false):mapExec(data);
    }
    if(!id) throw new Error('ID inválido.');
    if(method==='DELETE'){const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error;return{ok:1};}
    if(method==='PUT'){
      const row=k==='scripts'
        ? {name:String(b.name||'').trim(),game:String(b.game||'Universal').trim(),price:Math.max(0,+b.price||0),description:String(b.desc||'').trim(),img:String(b.img||'').trim(),code:String(b.code||''),hot:!!b.hot}
        : {name:String(b.name||'').trim(),plat:String(b.plat||'').trim(),status:String(b.status||'').trim(),description:String(b.desc||'').trim(),link:String(b.link||'#').trim()};
      const {data,error}=await sb.from(table).update(row).eq('id',id).select(k==='scripts'?'id,name,game,price,hot,description,img':'id,name,plat,status,description,link').single();
      if(error) throw error;
      return k==='scripts'?mapScript(data,undefined,false):mapExec(data);
    }
  }
  if(p==='/cfg' && method==='PUT'){
    const {isAdmin}=await currentAuth(); if(!isAdmin) throw new Error('Acesso negado.');
    const map={name:'name',tag:'tag',logo:'logo',a:'a',b:'b',bg:'bg',r:'radius',light:'light',discord:'discord',insta:'insta',footer:'footer'};
    const row={}; for(const [k,v] of Object.entries(b||{})) if(map[k]) row[map[k]]=v;
    const {data,error}=await sb.from('config').update(row).eq('id',1).select('*').single(); if(error)throw error;
    return {...data,r:data.radius};
  }
  if(p==='/reviews' && method==='POST'){
    const {data,error}=await sb.rpc('upsert_review',{p_rating:Math.round(+b.rating),p_text:String(b.text||'').trim().slice(0,300)});
    if(error)throw error; return {ok:1,data};
  }
  if(/^\/reviews\/[^/]+$/.test(p) && method==='DELETE'){
    const id=p.split('/')[2]; const {data:{user}}=await sb.auth.getUser(); if(!user)throw new Error('Faça login com o Discord.');
    const {error}=await sb.from('reviews').delete().eq('id',id); if(error)throw error; return {ok:1};
  }
  if(p==='/orders' && method==='POST'){
    const {data,error}=await sb.rpc('create_order',{p_script_ids:b.ids||[]}); if(error)throw error;
    return data;
  }
  if(p==='/orders' && method==='GET'){
    const {user,isAdmin}=await currentAuth(); if(!user)throw new Error('Faça login com o Discord.');
    let q=sb.from('orders').select('id,user_id,status,total,created_at,order_items(id,script_id,name,price)').order('created_at',{ascending:false});
    if(!isAdmin) q=q.eq('user_id',user.id);
    const {data,error}=await q; if(error)throw error;
    return (data||[]).map(o=>({id:o.id,userId:o.user_id,status:o.status,total:+o.total,at:new Date(o.created_at).getTime(),items:(o.order_items||[]).map(i=>({id:i.script_id,name:i.name,price:+i.price}))}));
  }
  if(/^\/orders\/[^/]+\/status$/.test(p) && method==='POST'){
    const {isAdmin}=await currentAuth();if(!isAdmin)throw new Error('Acesso negado.');
    if(!['pending','paid','cancelled'].includes(b.status))throw new Error('Status inválido.');
    const {data,error}=await sb.from('orders').update({status:b.status}).eq('id',p.split('/')[2]).select('*').single();if(error)throw error;return data;
  }
  if(p==='/support/mine'){
    const {user}=await sb.auth.getUser(); if(!user)throw new Error('Faça login com o Discord.');
    if(method==='GET'){
      const {data,error}=await sb.from('tickets').select('id,user_id,status,updated_at,messages(id,sender_user_id,sender_role,text,created_at)').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();
      if(error)throw error;
      if(!data)return{ticket:null};
      return{ticket:{id:data.id,userId:data.user_id,status:data.status,updated:new Date(data.updated_at).getTime(),messages:(data.messages||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(x=>({from:x.sender_role==='user'?'user':'staff',name:x.sender_role==='user'?(user.user_metadata?.full_name||user.email||'Você'):'Equipe',text:x.text,at:new Date(x.created_at).getTime()}))}};
    }
    const {error}=await sb.rpc('send_support_message',{p_text:String(b.text||'').slice(0,800)}); if(error)throw error;
    const {data:ticket,error:readError}=await sb.from('tickets').select('id,user_id,username,status,updated_at,messages(id,sender_user_id,sender_role,text,created_at)').eq('user_id',user.id).eq('status','open').order('updated_at',{ascending:false}).limit(1).maybeSingle();
    if(readError) throw readError;
    return {ticket:{id:ticket.id,userId:ticket.user_id,status:ticket.status,updated:new Date(ticket.updated_at).getTime(),messages:(ticket.messages||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(x=>({from:x.sender_role==='user'?'user':'staff',name:x.sender_role==='user'?(ticket.username||'Você'):'Equipe',text:x.text,at:new Date(x.created_at).getTime()}))}};
  }
  if(p==='/support' && method==='GET'){
    const {isAdmin}=await currentAuth();if(!isAdmin)throw new Error('Acesso negado.');
    const {data,error}=await sb.from('tickets').select('id,user_id,status,updated_at,messages(id,sender_user_id,sender_role,text,created_at)').order('updated_at',{ascending:false});if(error)throw error;
    return (data||[]).map(t=>({id:t.id,userId:t.user_id,username:t.username||'Cliente',status:t.status,updated:new Date(t.updated_at).getTime(),messages:(t.messages||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(x=>({from:x.sender_role==='user'?'user':'staff',name:x.sender_role==='user'?'Cliente':'Equipe',text:x.text,at:new Date(x.created_at).getTime()}))}));
  }
  if(/^\/support\/[^/]+\/messages$/.test(p) && method==='POST'){
    const {isAdmin}=await currentAuth();if(!isAdmin)throw new Error('Acesso negado.');
    const {data,error}=await sb.rpc('admin_reply',{p_ticket_id:p.split('/')[2],p_text:String(b.text||'').slice(0,800)});if(error)throw error;return data;
  }
  if(/^\/support\/[^/]+\/close$/.test(p) && method==='POST'){
    const {isAdmin}=await currentAuth();if(!isAdmin)throw new Error('Acesso negado.');
    const {error}=await sb.rpc('close_ticket',{p_ticket_id:p.split('/')[2]});if(error)throw error;return{ok:1};
  }
  throw new Error('Rota não encontrada.');
};

function render() { $('#app').innerHTML = V[view](); theme(); }
function go(v, o = {}) { view = v; if (o.cat !== undefined) cat = o.cat; if (o.q !== undefined) q = o.q; $('#dr').classList.remove('open'); render(); scrollTo({ top: 0, behavior: 'instant' }); }
function modal(h) { const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="box"><button class="x" aria-label="Fechar">×</button>${h}</div>`; o.onclick = e => { if (e.target == o || e.target.classList.contains('x')) o.remove(); }; $('#layer').append(o); return o; }
function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => { const a = document.createElement('textarea'); a.value = t; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }); toast('Script copiado!'); }

  $('#ci').onkeydown = e => { if (e.key == 'Enter') sendChat(); };
}
async function sendChat() { const i = $('#ci'), t = i.value.trim(); if (!t) return; i.value = ''; try { const { ticket } = await api('/support/mine', 'POST', { text: t }); $('#cm').innerHTML = chatHTML(ticket); $('#cm').scrollTop = 9e9; } catch (e) { i.value = t; fail(e); } }

/* ---- painel admin ---- */
const FM = { scripts: [['name', 'Nome'], ['game', 'Jogo / categoria'], ['price', 'Preço em R$ (0 = grátis)', 'n'], ['desc', 'Descrição'], ['img', 'URL da capa (opcional)'], ['code', 'Script', 't'], ['hot', 'Destaque na home', 'c']], execs: [['name', 'Nome'], ['plat', 'Plataforma (PC / Android / iOS)'], ['status', 'Status (Online / Atualizando)'], ['desc', 'Descrição'], ['link', 'Link de download']] };
function unlock() {
  const o = modal('<div class="bp"><h2>Senha de admin</h2><p style="color:var(--mut)">Confirme a senha para abrir o painel.</p><input class="in" id="upw" type="password"><div class="msg" id="ums"></div><span class="btn" id="ugo" style="width:100%">Entrar</span></div>');
  o.querySelector('#ugo').onclick = async () => { try { await api('/admin/unlock', 'POST', { password: o.querySelector('#upw').value }); me = (await api('/me')).user; o.remove(); panel(); } catch (e) { o.querySelector('#ums').textContent = e.message; } };
}
async function panel(tab = 'scripts', eid = null) {
  if (!me || !me.isAdmin) return toast('Acesso restrito à equipe.');
  if (me.locked) return unlock();
  clearInterval(admT);
  let a = $('.adm'); if (!a) { a = document.createElement('div'); a.className = 'adm'; document.body.append(a); }
  const c = S.cfg, T = (k, n) => `<span class="btn s ${tab == k ? '' : 'o'}" data-t="${k}">${n}</span>`; let b = '', tk = [];
  try {
    if (tab == 'look') b = `<div class="ac"><div class="cols"><div><label>Nome do site</label><input class="in" data-k="name" value="${esc(c.name)}"></div><div><label>URL do logo</label><input class="in" data-k="logo" value="${esc(c.logo)}"></div></div><label>Frase principal</label><input class="in" data-k="tag" value="${esc(c.tag)}">
<div class="cols"><div><label>Link do Discord</label><input class="in" data-k="discord" value="${esc(c.discord)}"></div><div><label>Link do Instagram</label><input class="in" data-k="insta" value="${esc(c.insta)}"></div></div><label>Rodapé</label><input class="in" data-k="footer" value="${esc(c.footer)}">
<div class="cols"><div><label>Cor 1</label><input class="in" type="color" data-k="a" value="${c.a}"></div><div><label>Cor 2</label><input class="in" type="color" data-k="b" value="${c.b}"></div><div><label>Fundo</label><input class="in" type="color" data-k="bg" value="${c.bg}"></div><div><label>Arredondado ${c.r}px</label><input class="in" type="range" min="4" max="32" data-k="r" value="${c.r}"></div></div><label style="display:flex;gap:8px"><input type="checkbox" data-k="light" ${c.light ? 'checked' : ''}> Tema claro</label></div>`;
    else if (tab == 'orders') { const L = await api('/orders'); b = `<div class="ac">${L.map(o => `<div class="li" style="flex-wrap:wrap"><b>#${o.id} · ${esc(o.username)}</b><span>${brl(o.total)}</span><span class="tag">${o.status}</span><div style="flex-basis:100%;color:var(--mut);font-size:13px">${o.items.map(i => esc(i.name)).join(', ')}</div>${o.status == 'pending' ? `<span class="btn s" data-o="${o.id}" data-s="paid">Marcar pago</span><span class="btn s o" data-o="${o.id}" data-s="cancelled">Cancelar</span>` : ''}</div>`).join('') || '<p>Nenhum pedido.</p>'}</div>`; }
    else if (tab == 'tickets') {
      tk = await api('/support'); const t = tk.find(x => x.id == eid);
      b = `<div class="ac">${tk.map(x => `<div class="li"><b>${esc(x.username)} — ${esc(x.messages.at(-1)?.text || '')}</b><span class="tag ${x.status == 'open' ? 'on' : ''}">${x.status == 'open' ? 'aberto' : 'fechado'}</span><span class="btn s o" data-tk="${x.id}">Abrir</span></div>`).join('') || '<p>Nenhum ticket.</p>'}${t ? `<h3 style="font-size:24px;margin:20px 0 8px">Ticket de ${esc(t.username)}</h3><div class="chm" style="height:260px;border:1px solid var(--line);border-radius:14px">${chatHTML(t)}</div>${t.status == 'open' ? `<div class="chi" style="padding:10px 0"><input id="ri" class="in" style="margin:0" placeholder="Responder ao cliente"><span class="btn s" id="rs">Responder</span><span class="btn s o" id="rc">Fechar</span></div>` : ''}` : ''}</div>`;
      admT = setInterval(() => { if ($('.adm') && document.activeElement?.id != 'ri') panel('tickets', eid); }, 8000);
    } else {
      const e = S[tab].find(x => x.id == eid) || {};
      b = `<div class="ac"><h3 style="font-size:24px">${eid ? 'Editar' : 'Novo'} item</h3>${FM[tab].map(([k, n, t]) => t == 't' ? `<label>${n}</label><textarea class="in" id="f_${k}" rows="6" style="font-family:monospace">${esc(e[k])}</textarea>` : t == 'c' ? `<label style="display:flex;gap:8px"><input type="checkbox" id="f_${k}" ${e[k] ? 'checked' : ''}> ${n}</label><br>` : `<label>${n}</label><input class="in" id="f_${k}" ${t == 'n' ? 'type="number" step="0.01" min="0"' : ''} value="${esc(e[k])}">`).join('')}<span class="btn" id="sv">${eid ? 'Salvar' : 'Adicionar'}</span> ${eid ? `<span class="btn o" data-t="${tab}">Cancelar</span>` : ''}
<h3 style="font-size:24px;margin:26px 0 10px">Itens (${S[tab].length})</h3>${S[tab].map(x => `<div class="li"><b>${esc(x.name)}</b><span class="btn s o" data-e="${x.id}">Editar</span><span class="btn s" data-x="${x.id}">Excluir</span></div>`).join('')}</div>`;
    }
  } catch (e) { fail(e); b = '<div class="ac"><p>Não foi possível carregar.</p></div>'; }
  a.innerHTML = `<div class="ah"><h2>Painel admin</h2>${T('scripts', 'Scripts')}${T('execs', 'Executores')}${T('orders', 'Pedidos')}${T('tickets', 'Suporte')}${T('look', 'Aparência')}<span class="btn s" id="cl">Fechar</span></div>${b}`;
  a.querySelectorAll('[data-t]').forEach(x => x.onclick = () => panel(x.dataset.t));
  $('#cl').onclick = () => { clearInterval(admT); a.remove(); load(); };
  if (tab == 'look') a.querySelectorAll('[data-k]').forEach(i => i.onchange = async () => { const k = i.dataset.k, v = i.type == 'checkbox' ? i.checked : i.type == 'range' ? +i.value : i.value; S.cfg[k] = v; theme(); try { await api('/cfg', 'PUT', { [k]: v }); } catch (e) { fail(e); } });
  else if (tab == 'orders') a.querySelectorAll('[data-o]').forEach(x => x.onclick = async () => { try { await api(`/orders/${x.dataset.o}/status`, 'POST', { status: x.dataset.s }); panel('orders'); } catch (e) { fail(e); } });
  else if (tab == 'tickets') {
    a.querySelectorAll('[data-tk]').forEach(x => x.onclick = () => panel('tickets', x.dataset.tk));
    if ($('#rs')) { $('#rs').onclick = async () => { const v = $('#ri').value.trim(); if (!v) return; try { await api(`/support/${eid}/messages`, 'POST', { text: v }); panel('tickets', eid); } catch (e) { fail(e); } }; $('#rc').onclick = async () => { try { await api(`/support/${eid}/close`, 'POST'); panel('tickets', eid); } catch (e) { fail(e); } }; }
  } else {
    a.querySelectorAll('[data-e]').forEach(x => x.onclick = () => panel(tab, x.dataset.e));
    a.querySelectorAll('[data-x]').forEach(x => x.onclick = async () => { if (!confirm('Excluir este item?')) return; try { await api(`/${tab}/${x.dataset.x}`, 'DELETE'); await refresh(); panel(tab); } catch (e) { fail(e); } });
    $('#sv').onclick = async () => { const o = {}; FM[tab].forEach(([k, , t]) => { const i = $('#f_' + k); o[k] = t == 'c' ? i.checked : i.value; }); try { eid ? await api(`/${tab}/${eid}`, 'PUT', o) : await api(`/${tab}`, 'POST', o); await refresh(); toast('Salvo!'); panel(tab); } catch (e) { fail(e); } };
  }
}
const refresh = async () => { S = await api('/bootstrap'); };

/* ---- eventos ---- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return; const v = t.dataset.v, a = t.dataset.a;
  if (a == 'menu') drawer();
  else if (a == 'go') { document.querySelectorAll('.ov').forEach(x => x.remove()); go(v, t.dataset.c !== undefined ? { cat: t.dataset.c, q: '' } : {}); }
  else if (a == 'cat') { cat = v; render(); }
  else if (a == 'view') { if (!(e.target.closest('[data-a=add]'))) { document.querySelectorAll('.ov').forEach(x => x.remove()); show(v); } }
  else if (a == 'add') { if (!cart.includes(v)) cart.push(v); saveCart(); theme(); toast('Adicionado ao carrinho!'); }
  else if (a == 'cart') { $('#dr').classList.remove('open'); cartView(); }
  else if (a == 'rm') { cart = cart.filter(i => i != v); saveCart(); theme(); t.closest('.ov').remove(); cartView(); }
  else if (a == 'buy') { t.closest('.ov').remove(); checkout(); }
  else if (a == 'copy') copy(S.scripts.find(s => s.id == v).code);
  else if (a == 'dl') { const x = S.execs.find(i => i.id == v); x && x.link && x.link != '#' ? window.open(x.link, '_blank', 'noopener') : toast('Link ainda não configurado'); }
  else if (a == 'login') signInDiscord();
  else if (a == 'user') account();
  else if (a == 'orders') { document.querySelectorAll('.ov').forEach(x => x.remove()); $('#dr').classList.remove('open'); ordersView(); }
  else if (a == 'logout') { await api('/auth/logout', 'POST'); location.reload(); }
  else if (a == 'panel') { document.querySelectorAll('.ov').forEach(x => x.remove()); panel(); }
  else if (a == 'chat') openChat();
  else if (a == 'chatx') { clearInterval(chatT); $('#chat').innerHTML = ''; }
  else if (a == 'chats') sendChat();
  else if (a == 'rate') { myRate = +v; document.querySelectorAll('#rate span').forEach((s, i) => s.classList.toggle('on', i < myRate)); }
  else if (a == 'sendrv') { try { await api('/reviews', 'POST', { rating: myRate, text: $('#rt').value }); await refresh(); render(); toast('Avaliação publicada!'); } catch (er) { fail(er); } }
  else if (a == 'delrv') { if (confirm('Remover esta avaliação?')) { try { await api('/reviews/' + v, 'DELETE'); await refresh(); render(); } catch (er) { fail(er); } } }
});
$('#dr').onclick = e => { if (e.target.id == 'dr') e.target.classList.remove('open'); };
$('#sq').onkeydown = e => { if (e.key == 'Enter') go('scripts', { q: e.target.value, cat: 'Todos' }); };
sb.auth.onAuthStateChange((_event, _session) => { if (_event === 'SIGNED_IN' || _event === 'SIGNED_OUT') load(); });
load();
</script>
</body>
</html>
