<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050305;--tx:#f5f1f2;--mut:#9b9094;--card:#0d0809;--line:rgba(255,60,70,.18);--a:#ff2d3d;--b:#ff7a45;--r:20px;--g:linear-gradient(135deg,var(--a),var(--b));--ok:#27d17f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root.light{--tx:#1d1214;--mut:#6f6366;--card:#fff;--line:rgba(0,0,0,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 35% at 50% 0%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%),radial-gradient(40% 30% at 100% 60%,color-mix(in srgb,var(--b) 12%,transparent),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
.btn{border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:99px;background:var(--g);color:#fff;font-weight:700;transition:.2s;text-decoration:none;box-shadow:0 8px 26px color-mix(in srgb,var(--a) 40%,transparent)}
.btn:hover{transform:translateY(-2px)}.btn.o{background:transparent;border:1.5px solid var(--a);box-shadow:none;color:var(--tx)}.btn.o:hover{background:color-mix(in srgb,var(--a) 15%,transparent)}.btn.s{padding:7px 14px;font-size:13px}
.ic{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cnt{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:99px;background:var(--a);font:700 11px Inter;display:grid;place-items:center;color:#fff}
header{position:sticky;top:10px;z-index:30;margin:10px auto 0;width:min(1180px,calc(100% - 20px));display:flex;gap:8px;align-items:center;padding:8px;border-radius:calc(var(--r) + 4px);border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px)}
.sb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 14px;height:46px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0}.sb svg{width:18px;stroke:var(--mut);fill:none;stroke-width:2}
.lg{display:flex;align-items:center;gap:8px;font:800 20px 'Barlow Condensed';cursor:pointer;text-transform:uppercase}
.lg i{width:38px;height:38px;border-radius:12px;background:var(--g) center/cover;display:grid;place-items:center;font:800 18px 'Barlow Condensed';font-style:normal;color:#fff}
.lg span{display:none}@media(min-width:700px){.lg span{display:block}}
main{width:min(1180px,100%);margin:auto;padding:0 14px 40px}
.sec{margin-top:46px}.sec>h2{font-size:clamp(28px,6vw,40px);text-align:center;font-weight:800}.sec>p{text-align:center;color:var(--mut);margin:4px 0 20px}
.k{display:block;text-align:center;color:var(--a);font:700 12px Inter;letter-spacing:.35em;text-transform:uppercase;margin:10px 0 6px}
.hero{text-align:center;padding:50px 0 10px}
.hero h1{font-size:clamp(54px,15vw,120px);line-height:.9;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px color-mix(in srgb,var(--a) 35%,transparent))}
.pan{border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--a) 8%,var(--card)),var(--card));border-radius:var(--r);padding:20px}
.hero .pan{margin:22px 0;font-size:16px}.hero b{color:var(--a)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cta{height:78px;border-radius:var(--r);border:2px solid var(--a);background:var(--card);display:flex;align-items:center;justify-content:center;gap:10px;font:700 17px 'Barlow Condensed';text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px color-mix(in srgb,var(--a) 25%,transparent);color:var(--a)}
.cta.bl{border-color:#2f8bff;color:#4ea0ff;box-shadow:0 0 30px rgba(47,139,255,.25)}
.ban{height:clamp(170px,32vw,300px);border-radius:var(--r);margin-top:14px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line);background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.04) 22px 23px),radial-gradient(80% 120% at 85% 0%,hsl(var(--h) 85% 45%),transparent 70%),#0a0507;transition:.25s}
.ban:hover{transform:scale(1.01)}.ban h3{font-size:clamp(40px,10vw,76px);line-height:.9;font-weight:800}.ban h3 em{font-style:normal;color:var(--a);display:block}.ban small{color:#ddd;margin-top:6px}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none}.car>*{scroll-snap-align:center;flex:0 0 min(82%,380px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--a);box-shadow:0 18px 40px color-mix(in srgb,var(--a) 22%,transparent)}
.cov{aspect-ratio:16/9;position:relative;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,255,255,.05) 18px 19px),linear-gradient(135deg,hsl(var(--h) 75% 26%),#09050a) center/cover;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px}
.cov b{font:800 clamp(24px,5vw,34px)/.95 'Barlow Condensed';text-transform:uppercase;text-shadow:0 3px 14px #000;color:#fff}
.bd{position:absolute;top:8px;left:8px;padding:3px 10px;border-radius:99px;font:700 11px Inter;background:var(--a);color:#fff}.bd.f{background:var(--ok);color:#052}.bd.h{left:auto;right:8px;background:#fff;color:#111}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}.st{color:#ffc233;letter-spacing:2px;font-size:13px}
.cb h3{font-size:19px;line-height:1.05;font-weight:700}.cb small{color:var(--mut)}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}.pr b{font:800 22px 'Barlow Condensed';color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chip{flex:none;padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);font:700 14px 'Barlow Condensed';text-transform:uppercase;cursor:pointer;color:var(--mut);letter-spacing:.04em}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.stats{display:grid;gap:0}.stats>div{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px;border-bottom:1px solid var(--line)}.stats>div:last-child{border:0}
.stats b{font:800 34px 'Barlow Condensed';color:var(--a);display:block;line-height:1}.stats span{color:var(--mut)}
.rv{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px;min-height:150px}.rv h4{margin:0 0 6px;font-size:15px}.rv p{margin:0 0 8px;color:var(--mut)}
.step{position:relative;padding:20px}.step i{position:absolute;top:8px;right:16px;font:800 52px 'Barlow Condensed';font-style:normal;color:color-mix(in srgb,var(--a) 28%,transparent)}.step h3{font-size:22px}.step p{color:var(--mut);margin:4px 0 0}
.ft{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px}.ft em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 15%,transparent);font-style:normal;font-size:22px}
details{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:700}details p{color:var(--mut);margin:8px 0 0}
.ex{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:12px;flex-wrap:wrap}
.ex>i{width:54px;height:54px;border-radius:16px;background:var(--g);display:grid;place-items:center;font:800 26px 'Barlow Condensed';font-style:normal;color:#fff}.ex div{flex:1;min-width:150px}.ex h3{font-size:22px}.ex p{margin:0;color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:11px;font-weight:700;margin-right:6px}.on{color:var(--ok)}
.hd{display:flex;align-items:center;gap:12px;margin:34px 0 12px}.hd h2{font-size:clamp(30px,7vw,44px);font-weight:800}
footer{margin-top:60px;border-top:1px solid var(--line);padding:40px 14px;text-align:center;color:var(--mut)}footer .lg{justify-content:center;margin-bottom:10px}footer a{color:var(--tx);cursor:pointer;margin:0 10px;font-weight:700}
.dr{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);visibility:hidden;opacity:0;transition:.25s}.dr.open{visibility:visible;opacity:1}
.dp{width:min(330px,82%);height:100%;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:12px;transform:translateX(-100%);transition:.3s}.dr.open .dp{transform:none}
.dp h4{color:var(--mut);letter-spacing:.2em;font-size:12px;margin:20px 8px 6px}.dp a{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--tx)}.dp a:hover{background:color-mix(in srgb,var(--a) 14%,transparent)}.dp a span{color:var(--a)}
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px;animation:f .2s}@keyframes f{from{opacity:0}}
.box{background:#120a0c;color:#f5f1f2;border:1px solid var(--line);border-radius:calc(var(--r) + 6px);width:min(500px,100%);max-height:92vh;overflow:auto;position:relative;animation:p .3s cubic-bezier(.2,1.2,.3,1)}@keyframes p{from{transform:scale(.92);opacity:0}}
.box .bp{padding:20px}.box .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;z-index:2}
.box h2{font-size:30px}.box .cov{aspect-ratio:2/1}
pre{background:#000;border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;max-height:200px;font:12px/1.5 ui-monospace,monospace;margin:12px 0;color:#f5f1f2}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);outline:0;margin-bottom:10px;color:inherit}.in:focus{border-color:var(--a)}select.in option{color:#111}
label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:4px}.msg{min-height:20px;color:#ff6b7a;font-weight:700;font-size:13px;margin-bottom:8px}
.adm{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:16px 14px 60px}.ah{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto 16px}.ah h2{font-size:30px;margin-right:auto}.ac{max-width:900px;margin:auto}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}.li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}input[type=color]{padding:2px;height:46px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;background:var(--g);color:#fff;padding:10px 22px;border-radius:99px;font-weight:700;animation:p .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}

.av{width:32px;height:32px;border-radius:50%;object-fit:cover}
.chatb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:58px;height:58px;border-radius:50%;background:var(--g);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 50%,transparent);transition:.2s}.chatb:hover{transform:scale(1.08)}
.chat{position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:56;width:min(380px,calc(100% - 24px));height:min(520px,70vh);display:flex;flex-direction:column;background:#120a0c;color:#f5f1f2;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;animation:p .3s}
.chh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--g);color:#fff}
.chm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.cm{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.08);font-size:14px;word-break:break-word}.cm small{display:block;font-size:11px;color:#a79da0;font-weight:700}
.cm.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--a) 35%,#120a0c)}
.chi{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}.chi input{flex:1;min-width:0;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);outline:0;color:inherit}
.rate{font-size:30px;color:#555;cursor:pointer;margin:6px 0}.rate span.on{color:#ffc233}
</style>
</head>
<body>
<header><div class="ic" data-a="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
<div class="sb"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="sq" placeholder="O que você procura?"></div>
<div class="lg" data-a="go" data-v="home"><i id="lgi"></i><span id="nm"></span></div>
<div class="ic" id="usr" data-a="user" aria-label="Conta"></div>
<div class="ic" data-a="cart" aria-label="Carrinho"><svg viewBox="0 0 24 24"><path d="M2 3h3l3 12h11l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span class="cnt" id="cc">0</span></div></header>
<main id="app"></main>
<footer id="foot"></footer>
<div class="dr" id="dr"></div><div id="layer"></div><div id="chat"></div><div class="chatb" data-a="chat" aria-label="Suporte"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></svg></div>

<script src="/app.js"></script>
</body>
</html>
